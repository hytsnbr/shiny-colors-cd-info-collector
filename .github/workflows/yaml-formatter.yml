name: YAML Formatter

on:
  pull_request:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
    types:
      - opened # PR作成時
      - synchronize # PRのコミット更新時

jobs:
  format-yaml:
    name: Format YAML
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Format YAML Files
        id: formatYaml
        uses: yk-lab/yamlfmt-action@09b479266d67ef9a3baa347affa8320204271677 # v1.0.0
        with:
          path: ".github/workflows"
        continue-on-error: true

      - name: Commit & Push
        id: commit_push
        if: steps.formatYaml.outcome == 'failure'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: YAMLファイルをフォーマット"
